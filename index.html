<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LIME HUB Terminal</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #06080a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            min-height: 100vh; 
            padding: 25px; 
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0, 255, 102, 0.03) 0%, transparent 100%),
                        radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.05) 0%, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        .header { text-align: center; margin-top: 10px; z-index: 2; }
        .header h1 { 
            font-size: 28px; 
            font-weight: 900; 
            letter-spacing: 3px; 
            color: #00ff66; 
            text-shadow: 0 0 10px #00ff66, 0 0 20px rgba(0, 255, 102, 0.6); 
        }
        .header p { 
            font-size: 11px; 
            color: #a6adc8; 
            margin-top: 6px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Стильный лаймовый текстовый логотип вместо картинки */
        .logo-container { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 40px 0; 
            z-index: 2; 
        }
        .lime-text-logo {
            font-family: 'Courier New', Courier, monospace;
            font-size: 36px;
            font-weight: 900;
            color: #00ff66;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ff66, 0 0 30px rgba(0, 255, 102, 0.5);
            animation: pulse 2s infinite alternate ease-in-out;
        }

        @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.97); } 100% { opacity: 1; transform: scale(1.03); } }

        .menu-container { width: 100%; display: flex; flex-direction: column; gap: 18px; margin-bottom: 20px; z-index: 2; }
        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #0f141c 0%, #07090d 100%); 
            border: 2px solid #00ff66; 
            border-radius: 16px; 
            padding: 20px; 
            color: #ffffff; 
            font-size: 16px; 
            font-weight: 800; 
            text-align: left; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); 
            text-decoration: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        .btn:active { 
            transform: scale(0.96); 
            background: linear-gradient(135deg, #131a24 0%, #0b0f14 100%);
            box-shadow: 0 0 25px #00ff66; 
        }
        .btn-text { display: flex; flex-direction: column; }
        .btn-title { font-size: 18px; color: #ffffff; }
        .btn-subtitle { font-size: 11px; color: #a6adc8; margin-top: 4px; font-weight: 400; }
        .btn-icon { font-size: 22px; color: #00ff66; text-shadow: 0 0 10px #00ff66; }
        
        .footer-terminal { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            font-weight: 900; 
            color: #00ff66; 
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66; 
            text-align: center; 
            margin-bottom: 5px; 
            z-index: 2; 
        }
        .status-container { display: flex; align-items: center; gap: 7px; }
        .status-dot { 
            width: 8px; height: 8px; 
            background-color: #00ff66; 
            border-radius: 50%; 
            box-shadow: 0 0 12px #00ff66; 
            animation: blink 1.2s infinite; 
        }
        @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>LIME HUB</h1>
        <p>Система управления терминалом</p>
    </div>

    <!-- Текстовый неоновый маскот -->
    <div class="logo-container">
        <div class="lime-text-logo">[ LIME ]</div>
    </div>

    <div class="menu-container">
        <a href="https://t.me" class="btn" target="_blank">
            <div class="btn-text">
                <span class="btn-title">LIME VPN</span>
                <span class="btn-subtitle">Защита, высокая скорость и обход блокировок</span>
            </div>
            <span class="btn-icon">⚡</span>
        </a>
        <a href="https://t.me" class="btn" target="_blank">
            <div class="btn-text">
                <span class="btn-title">LIME Stars & Services</span>
                <span class="btn-subtitle">Покупка звёзд Telegram, Premium и NFT</span>
            </div>
            <span class="btn-icon">⭐</span>
        </a>
    </div>
    
    <div class="footer-terminal">
        <div class="status-container">
            <div class="status-dot"></div>
            <span>Статус: онлайн</span>
        </div>
        <span>Dev: @FMshotaet</span>
        <span>Наш хаб: @LimeHub_net</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
